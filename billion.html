</style></head><body><main class="wrap"><div class="top"><a href="index.html">← xlebush3k</a><span>SIMULATOR / 003</span></div><header class="hero"><div class="tag">WHAT WOULD YOU DO?</div><h1>Потрать <span style="color:var(--gold)">миллиард</span></h1><p style="color:var(--muted)">Тебе дали виртуальный миллиард евро. Трать сколько хочешь — это просто игра.</p></header><section class="balance"><small>ОСТАТОК НА СЧЁТЕ</small><div class="amount" id="balance">€1 000 000 000</div><div class="bar"><div id="bar"></div></div></section><div class="grid" id="items"></div><div class="msg" id="msg"></div><div class="bottom"><button class="secondary" id="undo">↶ Отменить последнюю покупку</button><button class="secondary" id="reset">Начать заново</button></div></main><script>

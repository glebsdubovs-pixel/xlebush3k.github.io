
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Mix | xlebush3k</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000900;color:#d8ffe0;font-family:Consolas,Monaco,monospace}
header{text-align:center;padding:22px 12px;border-bottom:1px solid #07551c}
a{color:#00ff41}
h1{color:#00ff41;text-shadow:0 0 15px #00ff4160}
main{max-width:850px;margin:24px auto;padding:12px}
.panel{background:#020e05;border:1px solid #07551c;border-radius:7px;padding:17px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:#8ba891;line-height:1.6}
.elements{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:1px solid #00ff41;background:#001b07;color:#00ff41;border-radius:5px;padding:12px}
button:hover{background:#00ff41;color:#001504}
button:focus-visible{outline:2px solid white;outline-offset:3px}
.element{min-height:60px}
.element.selected{background:#00ff41;color:#001504}
#mix{width:100%;margin-top:14px;font-weight:bold}
#result{text-align:center;font-size:19px;padding:18px 5px;overflow-wrap:anywhere}
#message{color:#00ff41;text-align:center;min-height:22px;font-size:13px}
#discoveries{line-height:2;overflow-wrap:anywhere}
@media(max-width:450px){main{padding:8px}.panel{padding:12px}}
</style>
</head>
<body>
<header>
<a href="index.html">← НАЗАД НА ГЛАВНУЮ</a>
<h1>🧪 INFINITE MIX</h1>
<div class="small">Выбирай два элемента и открывай новые комбинации!</div>
</header>

<main>
<section class="panel">
<div class="top">
<strong>ТВОИ ЭЛЕМЕНТЫ</strong>
<span id="count" class="small"></span>
</div>
<p class="small">Можно выбирать даже два одинаковых элемента!</p>
<div id="elements" class="elements"></div>
<button id="mix" type="button">⚗️ СМЕШАТЬ ЭЛЕМЕНТЫ</button>
<div id="result" aria-live="polite">Выбери два элемента!</div>
<div id="message" aria-live="polite"></div>
</section>

<section class="panel">
<div class="top">
<strong>🏆 ОТКРЫТИЯ</strong>
<button id="reset" type="button">Сбросить прогресс</button>
</div>
<p class="small">Найденные элементы сохраняются в браузере.</p>
<div id="discoveries">Пока нет открытий.</div>
</section>
</main>

<script>
(function(){
"use strict";

const initial=[
 {n:"Вода",e:"💧"},
 {n:"Огонь",e:"🔥"},
 {n:"Земля",e:"🌍"},
 {n:"Воздух",e:"💨"}
];

function key(a,b){
 return [a,b].sort((x,y)=>x.localeCompare(y,"ru")).join("|");
}

const rawRecipes={
 "Вода|Вода":{n:"Лужа",e:"💦"},
 "Огонь|Огонь":{n:"Пламя",e:"🔥"},
 "Земля|Земля":{n:"Гора",e:"⛰️"},
 "Воздух|Воздух":{n:"Ветер",e:"🌪️"},

 "Вода|Огонь":{n:"Пар",e:"♨️"},
 "Вода|Земля":{n:"Грязь",e:"🟤"},
 "Воздух|Вода":{n:"Дождь",e:"🌧️"},
 "Воздух|Огонь":{n:"Дым",e:"💨"},
 "Воздух|Земля":{n:"Пыль",e:"🌫️"},
 "Земля|Огонь":{n:"Лава",e:"🌋"},

 "Дождь|Земля":{n:"Растение",e:"🌱"},
 "Вода|Растение":{n:"Водоросли",e:"🌿"},
 "Огонь|Растение":{n:"Пепел",e:"🪵"},
 "Вода|Грязь":{n:"Болото",e:"🐸"},
 "Воздух|Пар":{n:"Облако",e:"☁️"},
 "Облако|Вода":{n:"Снег",e:"❄️"},
 "Огонь|Пыль":{n:"Стекло",e:"🪟"},
 "Лава|Вода":{n:"Камень",e:"🪨"},
 "Камень|Воздух":{n:"Песок",e:"🏖️"},
 "Земля|Растение":{n:"Дерево",e:"🌳"},
 "Дерево|Огонь":{n:"Уголь",e:"⚫"},
 "Вода|Камень":{n:"Глина",e:"🏺"},
 "Глина|Огонь":{n:"Кирпич",e:"🧱"},
 "Камень|Огонь":{n:"Металл",e:"🔩"},
 "Металл|Огонь":{n:"Меч",e:"⚔️"},
 "Песок|Вода":{n:"Пляж",e:"🏝️"},
 "Вода|Жизнь":{n:"Рыба",e:"🐟"},
 "Воздух|Жизнь":{n:"Птица",e:"🐦"},
 "Облако|Воздух":{n:"Небо",e:"🌌"},
 "Небо|Огонь":{n:"Звезда",e:"⭐"},
 "Звезда|Небо":{n:"Космос",e:"🌠"},
 "Космос|Земля":{n:"Планета",e:"🪐"},
 "Человек|Металл":{n:"Робот",e:"🤖"},
 "Дерево|Вода":{n:"Лодка",e:"🛶"},
 "Кирпич|Кирпич":{n:"Дом",e:"🏠"},
 "Вода|Дождь":{n:"Река",e:"🏞️"},
 "Дерево|Земля":{n:"Лес",e:"🌲"},
 "Лава|Воздух":{n:"Пепел",e:"🌋"},
 "Вода|Песок":{n:"Пляж",e:"🏝️"},
 "Дерево|Кирпич":{n:"Дом",e:"🏠"},
 "Металл|Камень":{n:"Инструмент",e:"🛠️"},
 "Пар|Воздух":{n:"Облако",e:"☁️"},
 "Пыль|Вода":{n:"Грязь",e:"🟤"},
 "Растение|Солнце":{n:"Цветок",e:"🌻"},
 "Вода|Лужа":{n:"Озеро",e:"🏞️"},
 "Пламя|Воздух":{n:"Пожар",e:"🔥"},
 "Гора|Вода":{n:"Река",e:"🏞️"},
 "Ветер|Вода":{n:"Волна",e:"🌊"},
 "Волна|Земля":{n:"Берег",e:"🏖️"},
 "Песок|Огонь":{n:"Стекло",e:"🪟"},
 "Камень|Камень":{n:"Гора",e:"⛰️"},
 "Лес|Огонь":{n:"Пожар",e:"🔥"},
 "Растение|Вода":{n:"Водоросли",e:"🌿"},
 "Дождь|Ветер":{n:"Шторм",e:"🌩️"},
 "Снег|Солнце":{n:"Вода",e:"💧"}
};

// Нормализуем ключи, чтобы рецепты работали в любом порядке.
const recipes={};
Object.entries(rawRecipes).forEach(([pair,result])=>{
 const parts=pair.split("|");
 recipes[key(parts[0],parts[1])]=result;
});

let known=initial.slice();
let discovered=[];
let selected=[];

try{
 const saved=JSON.parse(localStorage.getItem("infiniteMixSave")||"null");
 if(saved&&Array.isArray(saved.known)){
  saved.known.forEach(x=>{
   if(x&&typeof x.n==="string"&&typeof x.e==="string"&&
      !known.some(y=>y.n===x.n)){
    known.push(x);
   }
  });
 }
 if(saved&&Array.isArray(saved.discovered)){
  discovered=saved.discovered.filter(x=>
   x&&typeof x.n==="string"&&typeof x.e==="string"
  );
 }
}catch(e){}

function save(){
 try{
  localStorage.setItem("infiniteMixSave",
   JSON.stringify({known,discovered}));
 }catch(e){}
}

function say(text){
 document.getElementById("message").textContent=text;
}

function render(){
 const root=document.getElementById("elements");
 root.replaceChildren();

 known.forEach(item=>{
  const button=document.createElement("button");
  button.type="button";

  const selectedCount=selected.filter(n=>n===item.n).length;
  button.className="element"+(selectedCount>0?" selected":"");
  button.textContent=item.e+" "+item.n+
   (selectedCount>1?" ×"+selectedCount:"");
  button.setAttribute("aria-pressed",String(selectedCount>0));

  button.addEventListener("click",()=>{
   if(selected.length>=2){
    say("Сначала смешай выбранные элементы.");
    return;
   }
   selected.push(item.n);
   say("");
   render();
  });

  root.appendChild(button);
 });

 document.getElementById("count").textContent=
  known.length+" элементов";

 document.getElementById("discoveries").textContent=
  discovered.length
   ?discovered.map(x=>x.e+" "+x.n).join(" · ")
   :"Пока нет открытий.";
}

function mix(){
 if(selected.length!==2){
  say("❗ Сначала выбери два элемента!");
  return;
 }

 const a=selected[0];
 const b=selected[1];
 const out=recipes[key(a,b)];

 if(!out){
  document.getElementById("result").textContent=
   a+" + "+b+" — комбинация не найдена.";
  say("Попробуй другую пару элементов.");
  selected=[];
  render();
  return;
 }

 const alreadyKnown=known.some(x=>x.n===out.n);

 if(!alreadyKnown){
  known.push(out);
  discovered.push(out);
  say("🎉 Новое открытие!");
 }else{
  say("Этот элемент уже открыт!");
 }

 document.getElementById("result").textContent=
  a+" + "+b+" = "+out.e+" "+out.n;

 selected=[];
 save();
 render();
}

document.getElementById("mix").addEventListener("click",mix);

document.getElementById("reset").addEventListener("click",()=>{
 if(!confirm("Точно сбросить все открытия?"))return;

 known=initial.slice();
 discovered=[];
 selected=[];
 save();

 document.getElementById("result").textContent="Выбери два элемента!";
 say("Прогресс сброшен.");
 render();
});

render();
})();
</script>
</body>
</html>
